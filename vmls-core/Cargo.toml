[package]
name = "vmls-core"
version = "0.1.1"
edition = "2024"
# The patched crypto-bigint 0.7.6 graph requires Rust 1.87. The published
# repository's CI checks the 1.87 floor and the pinned 1.94.1 toolchain in
# both feature modes and compiles the no_std codecs for a bare-metal
# thumbv7em target.
rust-version = "1.87"
license = "MIT"
publish = false
description = "Canonical VMLS/1 wire codecs: envelope, inner record, leaf binding, capability record and lane table"

[lib]
path = "src/lib.rs"

[dependencies]
# Decision D7 (2026-09-28): one BIP-340 verifier and one HKDF for web and
# Android. No default features: no RNG, no std-only paths, wasm32-clean.
k256 = { version = "0.14.0", default-features = false, features = ["schnorr"] }
# Hold every consumer lock above the patched RUSTSEC-2026-0387 floor.
crypto-bigint = { version = "0.7.6", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
hkdf = { version = "0.12.4", default-features = false }
# Contract §5.1/§4.2 (2026-09-29): strict Ed25519 verification of slot and
# witness receipts under the pinned Link node key. Same version as the
# OpenMLS graph in vmls-mls; no default features (no std, no RNG).
ed25519-dalek = { version = "=2.2.0", default-features = false }

# Hosted callers retain the default. Disable it to share the same codecs and
# strict verifier with no_std + alloc consumers; an allocator is still required.
[features]
default = ["std"]
std = []

[dev-dependencies]
# Test-only AES-128-GCM for the record vectors. In production the AEAD is the
# MLS suite provider's, supplied through `record::RecordAead`.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
