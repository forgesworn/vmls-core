name: vmls-core checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codecs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Contract vector hashes
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          contract = Path('VMLS-1.md').read_text()
          expected = dict(re.findall(r'\| `([^`]+\.json)` \|[^|]*\| `([0-9a-f]{64})` \|', contract))
          if len(expected) != 11:
              raise SystemExit(f'expected 11 contract vector rows, found {len(expected)}')
          for name, digest in sorted(expected.items()):
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'{name}: expected {digest}, got {actual}')
              print(f'{actual}  {name}')
          PY
      - name: Formatting
        run: cargo fmt --manifest-path vmls-core/Cargo.toml --check
      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file vmls-core/Cargo.lock
      - name: Independent Node vector reader
        run: |
          node --check vectors/verify-vmls.mjs
          output=$(node vectors/verify-vmls.mjs)
          printf '%s\n' "$output"
          [[ "$output" == *"PASS 11 suites, 29169 independent assertions"* ]]
          ln -s vectors/verify-vmls.mjs .verify-vmls-link.mjs
          output=$(node .verify-vmls-link.mjs)
          rm .verify-vmls-link.mjs
          printf '%s\n' "$output"
          [[ "$output" == *"PASS 11 suites, 29169 independent assertions"* ]]
      - name: Independent vector regeneration
        run: |
          node --check vectors/generate-vmls.mjs
          output=$(node vectors/generate-vmls.mjs)
          printf '%s\n' "$output"
          [[ "$output" == *"PASS 11 vector files regenerated"* ]]
      - name: Canonical VMLS envelope codec
        run: cargo test --manifest-path vmls-core/Cargo.toml --locked
      - name: Declared Rust 1.87 floor in both modes
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          cargo +1.87.0 check --manifest-path vmls-core/Cargo.toml --lib --locked
          cargo +1.87.0 check --manifest-path vmls-core/Cargo.toml --no-default-features --lib --locked
      - name: Pinned 1.94.1 toolchain in both modes
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          cargo +1.94.1 check --manifest-path vmls-core/Cargo.toml --lib --locked
          cargo +1.94.1 check --manifest-path vmls-core/Cargo.toml --no-default-features --lib --locked
      - name: Same canonical vectors without std
        run: cargo test --manifest-path vmls-core/Cargo.toml --no-default-features --locked
      - name: Compile codecs and strict verifier for a target without std
        run: |
          rustup target add thumbv7em-none-eabi
          cargo check --manifest-path vmls-core/Cargo.toml --no-default-features --target thumbv7em-none-eabi --lib --locked
      - name: Compile tests for a hosted 32-bit target
        run: |
          rustup target add i686-unknown-linux-gnu
          cargo check --manifest-path vmls-core/Cargo.toml --tests --target i686-unknown-linux-gnu --locked
